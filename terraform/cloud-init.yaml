#cloud-config
package_update: true
package_upgrade: false

runcmd:
  # 0. Setup 2GB swap space (essential for 1 GB Micro instances, good safety for ARM)
  - fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
  - chmod 600 /swapfile
  - mkswap /swapfile
  - swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab

  # 1. Update iptables rules (Oracle Ubuntu default blocks non-SSH incoming ports)
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 8787 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - netfilter-persistent save || true

  # 2. Install Docker & Compose plugin
  - curl -fsSL https://get.docker.com | sh
  - usermod -aG docker ubuntu

  # 2.5 Setup and mount persistent PostgreSQL data volume (if block device attached via Terraform)
  - mkdir -p /mnt/postgres-data/pgdata
  - |
    for dev in /dev/oracleoci/oraclevdb /dev/sdb /dev/vdb; do
      if [ -b "$dev" ]; then
        echo "Found attached block storage device: $dev"
        blkid "$dev" || mkfs.ext4 -F -L postgres_data "$dev"
        UUID=$(blkid -s UUID -o value "$dev")
        if [ -n "$UUID" ] && ! grep -q "$UUID" /etc/fstab; then
          echo "UUID=$UUID /mnt/postgres-data ext4 defaults,noatime,_netdev 0 2" >> /etc/fstab
        fi
        mount /mnt/postgres-data || true
        mkdir -p /mnt/postgres-data/pgdata
        break
      fi
    done
  - mkdir -p /mnt/postgres-data/sqlite /mnt/postgres-data/pgdata
  - chmod 755 /mnt/postgres-data
  - chown -R 70:70 /mnt/postgres-data/supabase-data /mnt/postgres-data/pgdata 2>/dev/null || true
  - chmod 700 /mnt/postgres-data/supabase-data /mnt/postgres-data/pgdata 2>/dev/null || true

  # 3. Setup application directory and clone sidecars
  - mkdir -p /home/ubuntu/app
  - git clone ${repo_url} /home/ubuntu/app
  - git clone https://github.com/lakshya9pro2-dot/api.videogetter.git /home/ubuntu/api.videogetter
  - git clone https://github.com/titan717/vidcore-io-stream-resolver.git /home/ubuntu/vidcore-io-stream-resolver
  - cp /home/ubuntu/app/docker/videogetter.Dockerfile /home/ubuntu/api.videogetter/Dockerfile
  - cp /home/ubuntu/app/docker/vidcore.Dockerfile /home/ubuntu/vidcore-io-stream-resolver/Dockerfile
  - chown -R ubuntu:ubuntu /home/ubuntu

  # 4. Generate .env file with database, JWT, and sidecar microservice endpoints
  - echo "TMDB_API_KEY=${tmdb_api_key}" > /home/ubuntu/app/.env
  - echo "API_PORT=${api_port}" >> /home/ubuntu/app/.env
  - echo "BIND_HOST=0.0.0.0" >> /home/ubuntu/app/.env
  - echo "POSTGRES_USER=${postgres_user}" >> /home/ubuntu/app/.env
  - echo "POSTGRES_PASSWORD=${postgres_password}" >> /home/ubuntu/app/.env
  - echo "POSTGRES_DB=${postgres_db}" >> /home/ubuntu/app/.env
  - echo "DATABASE_URL=postgresql://${postgres_user}:${postgres_password}@postgres:5432/${postgres_db}" >> /home/ubuntu/app/.env
  - echo "SYNC_JWT_SECRET=${sync_jwt_secret}" >> /home/ubuntu/app/.env
  - echo "POSTGRES_DATA_DIR=/mnt/postgres-data" >> /home/ubuntu/app/.env
  - echo "VIDEOGETTER_API_BASE=http://videogetter:8088" >> /home/ubuntu/app/.env
  - echo "ENABLE_VIDEOGETTER_PROVIDER=true" >> /home/ubuntu/app/.env
  - echo "VIDCORE_RESOLVER_BASE=http://vidcore:8789" >> /home/ubuntu/app/.env
  - echo "ENABLE_VIDCORE_PROVIDER=true" >> /home/ubuntu/app/.env
  - chown ubuntu:ubuntu /home/ubuntu/app/.env

  # 5. Build and launch containers as ubuntu user
  - sudo -u ubuntu docker compose -f /home/ubuntu/app/docker-compose.yml up -d --build
