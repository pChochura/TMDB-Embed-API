version: '3.9'
services:
  tmdb-embed-api:
    build: .
    container_name: tmdb-embed-api
    environment:
      # Provide at least one TMDB key (comma separated or override via UI later)
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      # Alternative: supply JSON array
      # - TMDB_API_KEYS=["key1","key2"]
      - API_PORT=8787
      - BIND_HOST=0.0.0.0
      # FebBox cookies (comma separated) if you want Showbox immediately functional
      - FEBBOX_COOKIES=${FEBBOX_COOKIES:-}
      # Stremio HTTP bridge sidecars (comma-separated base URLs e.g. http://webstreamr:51546,http://cinepro-core:3000/stremio)
      - STREMIO_BRIDGE_URLS=${STREMIO_BRIDGE_URLS:-}
    ports:
      - "8787:8787"
    volumes:
      # Persist runtime overrides (created by the admin UI)
      - user_config_data:/app/utils/user-config.json
      # Allow restart trigger file (optional; stored in container FS)
      # - restart_marker:/app/restart.trigger
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Optional sidecar: Webstreamr (Stremio HTTP Addon Bridge)
  # webstreamr:
  #   image: webstreamr/webstreamr:latest
  #   container_name: webstreamr
  #   restart: unless-stopped
  #   pull_policy: always
  #   ports:
  #     - "51546:51546"
  #   environment:
  #     - TMDB_ACCESS_TOKEN=${TMDB_ACCESS_TOKEN:-}
  #     - CACHE_DIR=/tmp
  #   volumes:
  #     - /tmp:/tmp

  # Optional sidecar: CinePro Core (Stremio HTTP Addon Bridge)
  # cinepro-core:
  #   image: ghcr.io/cinepro-org/core:latest
  #   container_name: cinepro-core
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - TMDB_API_KEY=${TMDB_API_KEY:-}
  #     - STREMIO_ADDON=true

  # Optional sidecar: VideoGetter (Go microservice)
  # videogetter:
  #   build: ../api.videogetter
  #   container_name: videogetter
  #   restart: unless-stopped
  #   ports:
  #     - "8088:8088"
  #   environment:
  #     - PORT=8088
  #     - API_KEY=${VIDEOGETTER_API_KEY:-lakshya9310081539@}

  # Optional sidecar: VidCore (Node/TS resolver & HLS proxy)
  # vidcore:
  #   build: ../vidcore-io-stream-resolver
  #   container_name: vidcore
  #   restart: unless-stopped
  #   ports:
  #     - "8789:8789"
  #   environment:
  #     - PORT=8789


volumes:
  user_config_data:
  # restart_marker:
