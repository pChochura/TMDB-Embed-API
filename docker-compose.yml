services:
  tmdb-embed-api:
    build: .
    container_name: tmdb-embed-api
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - API_SECRET_KEY=${API_SECRET_KEY:-}
      - API_PORT=8787
      - BIND_HOST=0.0.0.0
      - FEBBOX_COOKIES=${FEBBOX_COOKIES:-}
      - STREMIO_BRIDGE_URLS=${STREMIO_BRIDGE_URLS:-}
      - VIDEOGETTER_API_BASE=${VIDEOGETTER_API_BASE:-http://videogetter:8088}
      - ENABLE_VIDEOGETTER_PROVIDER=${ENABLE_VIDEOGETTER_PROVIDER:-true}
      - VIDEOGETTER_API_KEY=${VIDEOGETTER_API_KEY:-lakshya9310081539@}
      - VIDCORE_RESOLVER_BASE=${VIDCORE_RESOLVER_BASE:-http://vidcore:8789}
      - ENABLE_VIDCORE_PROVIDER=${ENABLE_VIDCORE_PROVIDER:-true}
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-supabase-db}
      - POSTGRES_PORT=5432
      - SYNC_JWT_SECRET=${SYNC_JWT_SECRET:-filman_sync_secret_key_change_me}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    ports:
      - "8787:8787"
    volumes:
      - user_config_data:/app/utils/user-config.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  videogetter:
    build: ../api.videogetter
    container_name: videogetter
    restart: unless-stopped
    environment:
      - PORT=8088
      - API_KEY=${VIDEOGETTER_API_KEY:-lakshya9310081539@}

  vidcore:
    build: ../vidcore-io-stream-resolver
    container_name: vidcore
    restart: unless-stopped
    environment:
      - PORT=8789

volumes:
  user_config_data:
