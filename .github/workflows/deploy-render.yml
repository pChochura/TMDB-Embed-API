name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify deployment authentication and streaming
        run: node --test test/deployment.test.js test/streaming.test.js
      - name: Trigger Render deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Set the RENDER_DEPLOY_HOOK_URL repository secret before deploying."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --max-time 30 --request POST "$DEPLOY_HOOK" > /dev/null
          echo "Render accepted the deploy hook. Check the Render dashboard for build and deployment status."
